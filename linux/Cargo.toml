[package]
name = "focusme-linux"
version = "0.1.0"
edition = "2021"
authors = ["FocusMe Engineering Team"]
description = "FocusMe Linux-specific components — eBPF LSM loader and DNS blocker"
license = "Proprietary"
rust-version = "1.75"

[dependencies]
# eBPF
libbpf-rs = "0.23"

# System
nix = { version = "0.31", features = ["fs", "signal", "process", "net"] }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
libbpf-cargo = "0.23"

[[bin]]
name = "focusme-bpf-loader"
path = "src/loader.rs"
