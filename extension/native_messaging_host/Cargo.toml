[package]
name = "focusme-native-messaging-host"
version = "0.1.0"
edition = "2021"
authors = ["FocusMe Engineering Team"]
description = "Native messaging host — bridges browser extension to FocusMe daemon via IPC"
license = "Proprietary"
rust-version = "1.75"

[[bin]]
name = "focusme-nmh"
path = "src/main.rs"

[dependencies]
# Serialization — Chrome Native Messaging uses JSON with 4-byte length prefix
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# IPC — connect to daemon
interprocess = "2.0"

# MessagePack — daemon protocol
rmp-serde = "1.1"

# Async runtime
tokio = { version = "1.35", features = ["rt", "io-util", "net", "sync", "time"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
] }
